name: Refresh contribution arcade

on:
  schedule:
    - cron: "17 4 * * *"      # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render NEURAL_GRID from live contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_arcade.py "${GITHUB_REPOSITORY_OWNER}" assets/02-grid.svg

      - name: Commit if the grid changed
        run: |
          if [[ -n "$(git status --porcelain assets/02-grid.svg)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/02-grid.svg
            git commit -m "chore: refresh contribution arcade"
            git push
          else
            echo "no change"
          fi
