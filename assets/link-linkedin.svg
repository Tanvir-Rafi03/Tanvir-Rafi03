<svg xmlns="http://www.w3.org/2000/svg" width="300" height="132" viewBox="0 0 300 132" role="img" aria-label="LINKEDIN connect">
<title>LINKEDIN — connect</title>
<defs>
  <linearGradient id="bdllinkedin" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#e8330a" stop-opacity="0"/><stop offset="50%" stop-color="#e8330a" stop-opacity=".08"/>
    <stop offset="100%" stop-color="#e8330a" stop-opacity="0"/></linearGradient>
  <style><![CDATA[
    .dllinkedin { font-family:'Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif }
