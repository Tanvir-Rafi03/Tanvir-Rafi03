<svg xmlns="http://www.w3.org/2000/svg" width="480" height="172" viewBox="0 0 480 172" role="img" aria-label="SOMETHING COOL">
<title>SOMETHING COOL</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#04001a"/><stop offset="100%" stop-color="#0a0330"/>
  </linearGradient>
  <radialGradient id="gw" cx="6%" cy="0%" r="88%">
    <stop offset="0%" stop-color="#bf80ff" stop-opacity=".26"/><stop offset="100%" stop-color="#bf80ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#bf80ff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#bf80ff" stop-opacity=".16"/>
    <stop offset="100%" stop-color="#bf80ff" stop-opacity="0"/>
  </linearGradient>
  <pattern id="sl" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1" fill="#bf80ff" opacity=".05"/></pattern>
  <clipPath id="cf"><rect width="480" height="172" rx="9"/></clipPath>
  <style><![CDATA[
    .f { font-family:'JetBrains Mono','Fira Code',ui-monospace,'SF Mono',Menlo,Consolas,monospace }
    @keyframes sweep { 0% { transform:translateX(-180px) } 100% { transform:translateX(520px) } }
    @keyframes puls  { 0%,100% { opacity:1 } 50% { opacity:.25 } }
    @keyframes glow  { 0%,100% { opacity:.55 } 50% { opacity:1 } }
    .sw { animation:sweep 4.6s cubic-bezier(.4,0,.2,1) infinite }
    .dt { animation:puls 1.5s ease-in-out infinite }
    .ac { animation:glow 2.8s ease-in-out infinite }
  ]]></style>
</defs>
<g clip-path="url(#cf)" class="f">
  <rect width="480" height="172" fill="url(#bg)"/>
  <rect width="480" height="172" fill="url(#gw)"/>
  <rect width="480" height="172" fill="url(#sl)"/>
  <rect class="sw" x="0" y="0" width="180" height="172" fill="url(#sw)"/>
  <rect class="ac" x="0" y="0" width="4" height="172" fill="#bf80ff"/>
