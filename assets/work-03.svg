<svg xmlns="http://www.w3.org/2000/svg" width="600" height="234" viewBox="0 0 600 234" role="img" aria-label="EcoWorld">
<title>EcoWorld</title>
<defs>
  <linearGradient id="bdw03" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1b3fa0" stop-opacity="0"/>
    <stop offset="50%" stop-color="#1b3fa0" stop-opacity=".06"/>
    <stop offset="100%" stop-color="#1b3fa0" stop-opacity="0"/>
  </linearGradient>
  <style><![CDATA[
    .dw03 { font-family:'Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif } .mw03 { font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace }
    @keyframes bdw03 { 0% { transform:translateX(-260px) } 100% { transform:translateX(640px) } }
    @keyframes arw03 { 0%,100% { transform:translateX(0) } 50% { transform:translateX(7px) } }
    .bdw03 { animation:bdw03 6.5s cubic-bezier(.45,0,.25,1) infinite }
    .arw03 { animation:arw03 2.1s ease-in-out infinite }
  ]]></style>
</defs>
<rect width="600" height="234" fill="#f2efe6"/>
<rect class="bdw03" x="0" y="0" width="260" height="234" fill="url(#bdw03)"/>
<path d="M0 .5 H600" stroke="#c9c2b4"/><path d="M.5 0 V234" stroke="#c9c2b4"/>
<text class="dw03" x="46" y="74" font-size="46" font-weight="800" letter-spacing="-2" fill="#1b3fa0" opacity=".22">03</text>
<text class="dw03" x="118" y="74" font-size="27" font-weight="700" letter-spacing="-1" fill="#14110f">EcoWorld</text>
<path d="M46 92 H554" stroke="#c9c2b4"/>
<text class="dw03" x="46" y="116" font-size="9.5" font-weight="600" letter-spacing="2.4" fill="#1b3fa0">Node · Express · PostgreSQL</text>
<text class="dw03" x="46" y="140" font-size="14.5" font-weight="400" letter-spacing="-.1" fill="#5c554d">Climate-solutions platform built on</text><text class="dw03" x="46" y="164" font-size="14.5" font-weight="400" letter-spacing="-.1" fill="#5c554d">REST routes and a Postgres store.</text>
