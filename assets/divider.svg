<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="16" viewBox="0 0 1200 16" role="img" aria-label="divider">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00bfff" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#00bfff" stop-opacity="0.85"/>
      <stop offset="50%"  stop-color="#7000ff" stop-opacity="0.85"/>
      <stop offset="82%"  stop-color="#00bfff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00bfff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00ffe0" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00ffe0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00ffe0" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes run { 0% { transform: translateX(-180px) } 100% { transform: translateX(1200px) } }
      @keyframes tick { 0%,100% { opacity:.25 } 50% { opacity:.8 } }
      .pkt { animation: run 3.4s linear infinite; }
      .tk  { animation: tick 2.2s ease-in-out infinite; }
    </style>
  </defs>
  <rect x="0" y="7" width="1200" height="2" fill="url(#d)"/>
  <g class="tk" fill="#00bfff">
    <rect x="120" y="4"  width="2" height="8"/><rect x="360" y="4"  width="2" height="8"/>
    <rect x="600" y="2"  width="2" height="12"/><rect x="840" y="4"  width="2" height="8"/>
    <rect x="1080" y="4" width="2" height="8"/>
  </g>
  <rect class="pkt" x="0" y="6" width="180" height="4" fill="url(#p)"/>
</svg>
