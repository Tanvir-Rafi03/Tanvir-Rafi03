<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-label="PHOTOBOOTH">
<title>PHOTOBOOTH — RARE</title>
<defs>
  <linearGradient id="bm04" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#05010f"/><stop offset="100%" stop-color="#0b0322"/></linearGradient>
  <radialGradient id="gm04" cx="4%" cy="0%" r="92%"><stop offset="0%" stop-color="#ff7b54" stop-opacity=".26"/><stop offset="100%" stop-color="#ff7b54" stop-opacity="0"/></radialGradient>
  <linearGradient id="sm04" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff7b54" stop-opacity="0"/><stop offset="50%" stop-color="#ff7b54" stop-opacity=".15"/><stop offset="100%" stop-color="#ff7b54" stop-opacity="0"/></linearGradient>
  <pattern id="pm04" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1" fill="#ff7b54" opacity=".05"/></pattern>
  <style><![CDATA[
    .fm04 { font-family:'JetBrains Mono','Fira Code',ui-monospace,'SF Mono',Menlo,Consolas,monospace }
    @keyframes sm04 { 0% { transform:translateX(-200px) } 100% { transform:translateX(640px) } }
    @keyframes pm04 { 0%,100% { opacity:1 } 50% { opacity:.25 } }
    @keyframes am04 { 0%,100% { opacity:.5 } 50% { opacity:1 } }
    .sm04 { animation:sm04 5s cubic-bezier(.4,0,.2,1) infinite }
    .pm04 { animation:pm04 1.5s ease-in-out infinite }
    .am04 { animation:am04 3s ease-in-out infinite }
  ]]></style>
</defs>
<g>
  <rect width="600" height="190" fill="url(#bm04)"/>
  <rect width="600" height="190" fill="url(#gm04)"/>
  <rect width="600" height="190" fill="url(#pm04)"/>
  <rect class="sm04" x="0" y="0" width="200" height="190" fill="url(#sm04)"/>
  <rect class="am04" x="0" y="0" width="3" height="190" fill="#ff7b54"/>
  <text class="fm04" x="576" y="60" font-size="48" font-weight="700" fill="#ff7b54" fill-opacity=".12" text-anchor="end">04</text>
  <text class="fm04" x="30" y="40" font-size="9.5" letter-spacing="3" fill="#ff7b54" opacity=".8">// MISSION_04</text>
  <text class="fm04" x="30" y="70" font-size="18" font-weight="700" letter-spacing="1.5" fill="#eaf6ff">PHOTOBOOTH</text>
  <text class="fm04" x="576" y="88" font-size="9" letter-spacing="3" fill="#ff7b54" opacity=".85" text-anchor="end">RARE</text>
  <text class="fm04" x="30" y="104" font-size="11.5" fill="#9fb8cf">Fish-themed Electron desktop</text><text class="fm04" x="30" y="121" font-size="11.5" fill="#9fb8cf">photobooth — filters, shutter</text><text class="fm04" x="30" y="138" font-size="11.5" fill="#9fb8cf">and retro photo strips.</text>
  <rect x="30" y="144" width="64" height="20" rx="3" fill="#ff7b54" fill-opacity=".10" stroke="#ff7b54" stroke-opacity=".4"/><text class="fm04" x="62" y="158" font-size="9.5" letter-spacing="1" fill="#ff7b54" text-anchor="middle">Electron</text><rect x="101" y="144" width="77" height="20" rx="3" fill="#ff7b54" fill-opacity=".10" stroke="#ff7b54" stroke-opacity=".4"/><text class="fm04" x="139" y="158" font-size="9.5" letter-spacing="1" fill="#ff7b54" text-anchor="middle">JavaScript</text><rect x="185" y="144" width="30" height="20" rx="3" fill="#ff7b54" fill-opacity=".10" stroke="#ff7b54" stroke-opacity=".4"/><text class="fm04" x="200" y="158" font-size="9.5" letter-spacing="1" fill="#ff7b54" text-anchor="middle">CSS</text>
  <circle class="pm04" cx="503" cy="152" r="3.6" fill="#00ff9d"/>
  <text class="fm04" x="576" y="156" font-size="9.5" letter-spacing="2" fill="#00ff9d" text-anchor="end">DEPLOYED</text>
  <g stroke="#ff7b54" stroke-width="1.4" fill="none" opacity=".5">
    <path d="M12 28 V12 H28"/><path d="M572 12 H588 V28"/>
    <path d="M12 162 V178 H28"/><path d="M588 162 V178 H572"/>
  </g>
  <rect x=".6" y=".6" width="598.8" height="188.8" fill="none" stroke="#ff7b54" stroke-opacity=".28"/>
